services:
  postgres:
    image: postgres:16-alpine
    container_name: gympal-postgres
    environment:
      POSTGRES_USER: gympal
      POSTGRES_PASSWORD: gympal
      POSTGRES_DB: gympal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gympal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gympal-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gympal:gympal@postgres:5432/gympal
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here}
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      EXERCISEDB_API_HOST: ${EXERCISEDB_API_HOST:-exercisedb.p.rapidapi.com}
      EXERCISEDB_API_KEY: ${EXERCISEDB_API_KEY:-your_rapidapi_key_here}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gympal-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: gympal-pgdata
