name: CI

on:
  push:
    branches: [main, master, develop, dev, 'feat/**', 'test/**', 'ci/**']
  pull_request:
    branches: [main, master, develop, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc
        working-directory: shared

      - name: Cache Prisma client
        uses: actions/cache@v5
        with:
          path: backend/node_modules/.prisma
          key: prisma-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run backend ESLint
        run: npm run lint --workspace=backend

      - name: Check formatting
        run: npx prettier --check "backend/src/**/*.ts" "shared/src/**/*.ts" --ignore-path backend/.prettierignore

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc
        working-directory: shared

      - name: Cache Prisma client
        uses: actions/cache@v5
        with:
          path: backend/node_modules/.prisma
          key: prisma-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run shared tests
        run: npx vitest run
        working-directory: shared

      - name: Run backend unit tests
        run: npm test --workspace=backend
        env:
          JWT_SECRET: test-secret

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc
        working-directory: shared

      - name: Cache Prisma client
        uses: actions/cache@v5
        with:
          path: backend/node_modules/.prisma
          key: prisma-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7
