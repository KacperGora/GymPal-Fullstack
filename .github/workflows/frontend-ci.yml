name: Frontend CI

on:
  push:
    branches: [main, master, develop, dev, 'feat/**', 'front/**']
  pull_request:
    branches: [main, master, develop, dev]

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc
        working-directory: shared

      - name: Run ESLint
        run: npm run lint --workspace=frontend

      - name: Check formatting
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,css,json}" --ignore-path .gitignore
        working-directory: frontend

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'pull_request' || contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/develop"]'), github.ref)
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc
        working-directory: shared

      - name: Build Next.js application
        run: npm run build --workspace=frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/.next
          retention-days: 7
