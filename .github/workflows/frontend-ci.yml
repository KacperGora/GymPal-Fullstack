name: Frontend CI

on:
  push:
    branches: [main, master, develop, dev, 'feat/**', 'front/**', 'test/**', 'ci/**']
  pull_request:
    branches: [main, master, develop, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc
        working-directory: shared

      - name: Run ESLint
        run: npm run lint --workspace=frontend

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc
        working-directory: shared

      - name: Run Vitest
        run: npm test --workspace=frontend

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request' || contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/develop","refs/heads/dev"]'), github.ref)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc
        working-directory: shared

      - name: Build Next.js application
        run: npm run build --workspace=frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/.next
          retention-days: 7
