steps:
  # Build backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '--no-cache',
        '-t',
        'gcr.io/$PROJECT_ID/gympal-backend',
        '-f',
        'backend/Dockerfile',
        '.',
      ]

  # Push backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gympal-backend']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - gympal-backend
      - --image=gcr.io/$PROJECT_ID/gympal-backend
      - --region=europe-west3

  # Build frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '--no-cache',
        '-t',
        'gcr.io/$PROJECT_ID/gympal-frontend',
        '-f',
        'frontend/Dockerfile',
        '.',
      ]

  # Push frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gympal-frontend']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - gympal-frontend
      - --image=gcr.io/$PROJECT_ID/gympal-frontend
      - --region=europe-west3

images:
  - 'gcr.io/$PROJECT_ID/gympal-backend'
  - 'gcr.io/$PROJECT_ID/gympal-frontend'
